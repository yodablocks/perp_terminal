[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perp-terminal"
version = "0.1.0"
description = "Read-only cross-venue market terminal for 8 perp DEXes. Public data, no execution."
requires-python = ">=3.12"
dependencies = [
    # TODO: switch to @v0.1.0 once the tag exists on perp-liquidity
    "perp-liquidity @ git+https://github.com/yodablocks/perp-liquidity@c7bea5cf62c6f0d309d452ad7223997b25b6df9e",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
]

[project.scripts]
perp-terminal = "perp_terminal.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
